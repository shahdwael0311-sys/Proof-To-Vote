<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Proof-To-Vote</title><link rel="stylesheet" href="/css/site.css"></head>
<body class="auth-page"><a class="brand auth-brand" href="/"><span class="brand-mark">✓</span><span>PROOF-<b>TO</b>-VOTE<small>STUDENT UNION PORTAL</small></span></a>
<main class="auth-card wide"><span class="eyebrow">STUDENT ENROLMENT</span><h1>Register</h1><p>Your wallet, student ID, email, and voter ID must each be unique. Login stays blocked until KYC approval.</p>
<form id="registerForm" class="form-grid"><label>Voter ID<input id="voter-id" required minlength="3"></label><label>Student ID<input id="student-id" required></label><label>University email<input type="email" id="email" required></label><label>Ganache wallet address<input id="wallet" required pattern="0x[a-fA-F0-9]{40}"></label><label class="span-2">Password<input type="password" id="password" required minlength="6"></label><button class="button large span-2" type="submit">Submit registration</button><p id="formMessage" class="message span-2" role="alert"></p></form>
<p class="switch">Already approved? <a href="/login">Login</a></p></main><script src="/js/register.js"></script></body></html>
